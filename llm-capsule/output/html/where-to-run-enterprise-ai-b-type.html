<!DOCTYPE html><html><head><script type="application/ld+json">{ "@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [ {"@type":"Question","name":"Why isn't the deployment decision just external or on-premise?","acceptedAnswer":{"@type":"Answer","text":"Because a typical enterprise has dozens of workflows with different sensitivity, capability requirements, and constraints. Marketing copy and customer service tickets are different workflows even if the same business unit owns both. Treating these as a single decision either over-protects the easy workflows (running them on internal infrastructure that costs operational effort without delivering proportionate value) or under-protects the hard ones (sending them to external endpoints because that's the company's 'AI strategy'). The realistic answer is different decisions for different workflow categories."}}, {"@type":"Question","name":"What are external LLMs actually good at, and what are their limits?","acceptedAnswer":{"@type":"Answer","text":"Frontier external models (GPT-5-class, Claude Opus-class, Gemini Ultra-class) operate at a capability level no enterprise will match internally — long context windows, complex document reasoning, regular improvement without retraining cycles. For workflows where capability matters, this is a different category of system. The limit is that the model runs on the vendor's infrastructure under the vendor's contractual commitments, not architectural guarantees. For workflows where data sensitivity rules out any external endpoint regardless of safeguards, external LLMs are not an option."}}, {"@type":"Question","name":"When is on-premise the right answer?","acceptedAnswer":{"@type":"Answer","text":"When the constraint is absolute (defence, certain classified categories, workflows where no version of the data, however transformed, can leave) and the workflow is bounded enough that a capable smaller model suffices. The strengths are real — data location is solved by definition, operational control is total, latency can be made predictable. The costs are also real and tend to be underestimated: capability lag of twelve to eighteen months versus frontier models, continuous operational cost dominated by the team (five to ten engineers minimum), and brittleness when the frontier leaps forward and the internal model doesn't."}}, {"@type":"Question","name":"Isn't running a hybrid topology more complex than picking one path?","acceptedAnswer":{"@type":"Answer","text":"Only superficially. Running both isn't more complex if the workflows that need each are different workflows — and they are. The complexity of hybrid lives in the routing layer that decides which model gets which workflow. That routing layer isn't optional; even pure-external or pure-on-premise enterprises have one, it's just trivial. Once the routing layer exists, supporting two backends is incremental complexity, not categorical complexity. The hard part is making the routing decision precise enough that workflows go where they should, with policy enforced and audit trail clear."}}, {"@type":"Question","name":"How do you decide which workflow goes where?","acceptedAnswer":{"@type":"Answer","text":"Evaluate each workflow against four questions. What is the data sensitivity (of the specific data this workflow needs, not the maximum anywhere in the enterprise)? What is the capability requirement (does the task need frontier reasoning, or will a smaller model suffice)? What is the constraint structure (absolute or conditional, externally driven or internal governance)? What is the tolerance for capability degradation? The answers cluster into rough categories: low-sensitivity goes external, transformable-with-high-capability goes external with transformation, absolute-constraint-but-bounded goes on-premise, absolute-with-high-capability is the hardest — sometimes not fully solvable today."}}, {"@type":"Question","name":"What goes wrong with an all-external or all-on-premise approach?","acceptedAnswer":{"@type":"Answer","text":"All-external organisations run into workflows the policy won't allow, and either those workflows don't get AI (the company falls behind on the work where AI matters most) or they get AI through unofficial channels — shadow AI is the predictable consequence. All-on-premise organisations run into the capability gap; internal models will be good enough for some workflows and not for others, and business units route around the policy through the same shadow channels. Both failure modes share a structure: a policy that doesn't account for workflow heterogeneity ends up bypassed."}}, {"@type":"Question","name":"What does a working hybrid architecture actually look like?","acceptedAnswer":{"@type":"Answer","text":"Four components. A unified integration layer (workflows call this layer, not the backends directly, so they're insulated from routing changes). Policy-driven routing (the decision of where a workflow runs is encoded in policy, versioned and auditable, not hard-coded in the workflow). A transformation layer for the external path (sensitive elements transformed before transmission and reconstructed on response, abstracted over which external vendor is the target). Shared governance (one audit log, one policy framework, one access control model covering both paths uniformly). When all four are in place, where a workflow runs becomes a policy decision rather than an architecture commitment."}} ] }</script></head><body></body></html>
